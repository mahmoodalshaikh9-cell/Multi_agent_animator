[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-proto"
version = "0.1.0"
description = "Streamlit UI for the Manim animation generation pipeline"
requires-python = ">=3.10"

dependencies = [
    "streamlit==1.58.0",
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.2.6",
    "manim==0.19.1",
    "openai==3.3.1",
    "requests==2.34.2",
    "toml==0.10.2",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools]
py-modules = [
    "streamlit_app",
    "test_iteration_video",
    "local_agent",
    "vision",
    "video_eval",
    "scene_meta",
    "metrics",
    "geometry",
    "merge_evaluation",
    "render_figures",
    "static_checks",
    "temporal",
    "extract_frame",
    "secrets_loader",
    "stress_prompts",
    "pipeline_deepseek",
    "render_ci",
    "build_site",
]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
